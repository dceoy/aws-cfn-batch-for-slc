---
name: CI/CD
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '10.x'
      - name: Install commands
        run: |
          python -m pip install --upgrade --no-cache-dir cfn-lint yamllint
          npm install -g jsonlint
      - name: Execute jsonlint
        run: |
          find . -type f -name '*.json' \
            | xargs -t jsonlint -q
      - name: Execute yamllint
        run: |
          find . -type f -name '*.yml' -o -name '*.yaml' \
            | xargs -t yamllint -d '{"extends": "relaxed", "rules": {"line-length": "disable"}}'
      - name: Execute cfn-lint
        run: |
          find . -type f -name '*.cfn.yml' -o -name '*.cfn.yaml' \
            | xargs -t cfn-lint --template
  dependabot-auto-merge:
    if: >
      github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    needs:
      - lint
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    uses: dceoy/gha-for-devops/.github/workflows/dependabot-auto-merge.yml@main  # zizmor: ignore[unpinned-uses]
    with:
      unconditional: true
